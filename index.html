<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transfer Window</title>
<meta name="description" content="A multiplayer auction draft game. Made by Harry Sujivan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
/* Layout: laptop game table. Each game mode repaints the ground through theme tokens; the player on the block is a trading card whose finish shows its rarity. */
:root{
  --bg:#0e3a28;--bg2:#114330;--panel:#0a2c1e;--panel2:#0d3324;--accent:#f2c14e;--accent2:#ff6b4a;
  --chalk:#f3f5f0;--dim:rgba(243,245,240,.66);--line:rgba(255,255,255,.14);--ink:#141414;
  --pattern:repeating-linear-gradient(90deg,var(--bg) 0 72px,var(--bg2) 72px 144px);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",ui-sans-serif,system-ui,sans-serif;
  --label:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
body[data-theme=anime]{--bg:#1a1036;--bg2:#251750;--panel:#120b28;--panel2:#1b1140;--accent:#ff5fae;--accent2:#4fd6ff;--pattern:repeating-linear-gradient(115deg,var(--bg) 0 46px,var(--bg2) 46px 50px)}
body[data-theme=mcu]{--bg:#2a0a0e;--bg2:#3b1016;--panel:#1d0609;--panel2:#2b0a0f;--accent:#ffd447;--accent2:#ff4141;--pattern:radial-gradient(circle at 20% 10%,#4a121a 0,transparent 45%),radial-gradient(circle at 85% 80%,#3d0e15 0,transparent 40%),var(--bg)}
body[data-theme=dceu]{--bg:#0c1424;--bg2:#13203a;--panel:#080e1a;--panel2:#0f1a2e;--accent:#4da3ff;--accent2:#ffcf3f;--pattern:linear-gradient(160deg,#132242 0,var(--bg) 55%)}
body[data-theme=basketball]{--bg:#3a1f10;--bg2:#432512;--panel:#24130a;--panel2:#30190d;--accent:#ff8a2a;--accent2:#ffe0b0;--pattern:repeating-linear-gradient(0deg,var(--bg) 0 38px,var(--bg2) 38px 40px)}
body[data-theme=cricket]{--bg:#1d3b1a;--bg2:#24481f;--panel:#132812;--panel2:#1a3418;--accent:#f4ecd0;--accent2:#e2513e;--pattern:radial-gradient(ellipse at 50% 40%,var(--bg2) 0,var(--bg) 70%)}
body[data-theme=baseball]{--bg:#0f1f3d;--bg2:#15284c;--panel:#0a1530;--panel2:#11203f;--accent:#ff5a4e;--accent2:#f5f1e6;--pattern:repeating-linear-gradient(45deg,var(--bg) 0 60px,var(--bg2) 60px 120px)}
body[data-theme=videogame]{--bg:#120a24;--bg2:#21133f;--panel:#0c0618;--panel2:#170c2e;--accent:#ffde3b;--accent2:#b46bff;--pattern:linear-gradient(var(--bg2) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,var(--bg2) 1px,transparent 1px) 0 0/32px 32px,var(--bg)}
body[data-theme=starwars]{--bg:#05060c;--bg2:#10142a;--panel:#0b0d18;--panel2:#121528;--accent:#ffe81f;--accent2:#4fc3ff;--pattern:radial-gradient(1px 1px at 20px 30px,#fff,transparent) 0 0/240px 220px,radial-gradient(1px 1px at 120px 80px,#cfd8ff,transparent) 0 0/240px 220px,radial-gradient(1.5px 1.5px at 200px 160px,#fff,transparent) 0 0/240px 220px,radial-gradient(1px 1px at 60px 190px,#fff,transparent) 0 0/240px 220px,var(--bg)}
body[data-theme=pokemon]{--bg:#8f1022;--bg2:#a3142a;--panel:#5c0a16;--panel2:#6e0d1b;--accent:#ffcb05;--accent2:#7fb2ff;--pattern:radial-gradient(circle at 50% 50%,transparent 0 46px,var(--bg2) 46px 50px,transparent 50px) 0 0/140px 140px,var(--bg)}
body[data-theme=mega]{--bg:#140f22;--bg2:#1d1631;--panel:#0e0a18;--panel2:#181227;--accent:#ff9f1c;--accent2:#2ec4b6;--pattern:conic-gradient(from 200deg at 80% 0%,#2a1640,var(--bg) 25%,#0f2230 50%,var(--bg) 75%,#2a1640)}
body[data-theme=custom]{--bg:#1c1f24;--bg2:#22262c;--panel:#13161a;--panel2:#1a1e23;--accent:#7cd4c4;--accent2:#ff8fa3;--pattern:repeating-linear-gradient(0deg,var(--bg) 0 24px,var(--bg2) 24px 25px)}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--pattern);background-color:var(--bg);background-attachment:fixed;color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:20px;padding-block:18px 40px;transition:background-color .4s}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:900;margin:0;text-wrap:balance;letter-spacing:.01em;text-transform:uppercase}
h2{font-size:1.7rem;line-height:1}
h3{font-size:1.2rem;line-height:1}
p{margin:0}
.lbl{font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.09em;font-size:.78rem;color:var(--dim)}
.muted{color:var(--dim)}.small{font-size:.86rem}
.acc{color:var(--accent)}
.panel{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
input,select,textarea{font:inherit;color:var(--chalk);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0}
textarea{width:100%;min-height:150px;resize:vertical}
select option,select optgroup{background:var(--panel);color:var(--chalk)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font-family:var(--label);font-weight:700;font-size:1rem;letter-spacing:.04em;text-transform:uppercase;border:0;border-radius:9px;padding:10px 16px;cursor:pointer;background:var(--chalk);color:var(--ink);transition:transform .08s,filter .15s}
button:not(:disabled):hover{filter:brightness(1.08)}
button:not(:disabled):active{transform:translateY(1px)}
button.acc-b{background:var(--accent);color:var(--ink)}
button.ghost{background:transparent;color:var(--chalk);border:1px solid var(--line)}
button.big{font-size:1.25rem;padding:14px 26px}
button.sm{font-size:.82rem;padding:6px 10px}
button:disabled{opacity:.32;cursor:not-allowed}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.brand{font-family:var(--display);font-weight:900;font-size:1.8rem;text-transform:uppercase;line-height:1}
.brand span{color:var(--accent)}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{font-family:var(--label);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;padding:4px 9px;border-radius:5px;background:var(--panel);color:var(--dim)}
.steps span.on{background:var(--accent);color:var(--ink)}
.steps span.done{color:var(--chalk)}
.credit{font-family:var(--label);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.8rem;color:var(--dim);text-align:center}
.credit b{color:var(--accent)}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:center;min-height:440px}
@media (max-width:860px){.hero{grid-template-columns:1fr}.deck{display:none}}
.title{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(3.4rem,9vw,7.5rem);line-height:.82;letter-spacing:-.01em}
.title .w{display:block}
.title .w:nth-child(2){color:var(--accent)}
.title i{font-style:normal;display:inline-block;animation:rise .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes rise{from{transform:translateY(60%) rotate(8deg);opacity:0}}
.tag{font-size:1.2rem;max-width:34ch;color:var(--dim)}
.netnote{font-size:.9rem;color:var(--dim)}
.netnote.err{color:var(--accent2)}
.deck{position:relative;height:420px}
.deck .card{position:absolute;width:170px;animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -14px}}
.deck .card.spin{animation:floaty 6s ease-in-out infinite,spin 9s ease-in-out infinite}
@keyframes spin{0%,80%{rotate:y 0deg}90%{rotate:y 180deg}100%{rotate:y 360deg}}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.howto .st{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.howto .num{font-family:var(--display);font-weight:900;font-size:2.4rem;line-height:.8;color:var(--accent)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border-radius:12px;color:#fff;border:1px solid rgba(255,255,255,.15);text-transform:none;letter-spacing:0}
.mode b{font-family:var(--display);font-weight:900;font-size:1.25rem;text-transform:uppercase;line-height:1}
.mode span{font-family:var(--body);font-weight:400;font-size:.82rem;opacity:.85}
.mode em{font-style:normal;font-family:var(--label);font-weight:700;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;opacity:.9;margin-top:4px}
.lb{display:grid;grid-template-columns:2em 1fr auto;gap:6px 10px;align-items:baseline}
.lb b{font-family:var(--display);font-size:1.2rem}
.joingrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.joingrid{grid-template-columns:1fr}}
.codein{font-family:var(--display);font-weight:900;font-size:2rem;letter-spacing:.2em;text-transform:uppercase;width:100%}
.codebig{font-family:var(--display);font-weight:900;font-size:3.8rem;letter-spacing:.14em;color:var(--accent);line-height:.9}
.card{--tier1:#e0a877;--tier2:#a8683c;color:var(--ink);background:linear-gradient(150deg,var(--tier1),var(--tier2));border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;position:relative;box-shadow:0 12px 0 rgba(0,0,0,.28),inset 0 0 0 2px rgba(255,255,255,.35);min-height:220px;overflow:hidden}
.card.silver{--tier1:#f4f6f9;--tier2:#a9b4bf}
.card.gold{--tier1:#fff0a8;--tier2:#d9a520}
.card.legend{background:linear-gradient(120deg,#ffd1f7,#c4f1ff,#fff3b0,#d4c4ff,#ffd1f7);background-size:300% 300%;animation:holo 5s linear infinite}
@keyframes holo{to{background-position:300% 0}}
.card.mystery{background:repeating-linear-gradient(45deg,#2a2a3a 0 14px,#34344c 14px 28px);color:var(--chalk);box-shadow:0 12px 0 rgba(0,0,0,.28),inset 0 0 0 2px var(--accent)}
.card.power{background:radial-gradient(circle at 30% 20%,#4b3a7a,#1b1530 70%);color:#fff;box-shadow:0 12px 0 rgba(0,0,0,.28),inset 0 0 0 2px var(--accent)}
.card .rt{font-family:var(--display);font-weight:900;font-size:4rem;line-height:.82}
.card .nm{font-family:var(--display);font-weight:900;font-size:1.7rem;line-height:.95;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.card .meta{font-family:var(--label);font-weight:700;letter-spacing:.07em;text-transform:uppercase;font-size:.82rem;display:flex;gap:4px 10px;flex-wrap:wrap}
.card .tier{position:absolute;top:12px;right:12px;font-family:var(--label);font-weight:700;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.78);color:#fff;padding:3px 8px;border-radius:4px}
.card .big{font-family:var(--display);font-weight:900;font-size:6rem;line-height:.8;color:var(--accent)}
.card .pw{font-family:var(--display);font-weight:900;font-size:3.4rem;line-height:.85;color:var(--accent)}
.deck .card .rt{font-size:3rem}.deck .card .nm{font-size:1.25rem}.deck .card{min-height:180px}
.flip{animation:flipIn .55s cubic-bezier(.2,1.2,.4,1) both}
@keyframes flipIn{from{transform:perspective(800px) rotateY(95deg) scale(.85);opacity:.3}}
.table{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.table{grid-template-columns:1fr}}
.cardwrap{display:flex;flex-direction:column;gap:12px}
.lotinfo{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.amt{font-family:var(--display);font-weight:900;font-size:4rem;line-height:.85;color:var(--accent);font-variant-numeric:tabular-nums}
.clock{display:flex;flex-direction:column;gap:5px;min-width:150px;text-align:right}
.clock .sec{font-family:var(--display);font-weight:900;font-size:3rem;line-height:.85;font-variant-numeric:tabular-nums}
.clock .barb{height:8px;border-radius:999px;background:var(--panel2);overflow:hidden}
.clock .barb b{display:block;height:100%;background:var(--accent);transition:width .1s linear}
.clock.hot .sec{color:var(--accent2)}.clock.hot .barb b{background:var(--accent2)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.flash{animation:flash .35s}
@keyframes flash{50%{box-shadow:inset 0 0 0 3px var(--accent2),0 0 30px color-mix(in srgb,var(--accent2) 50%,transparent)}}
.bidders{display:flex;flex-direction:column;gap:8px}
.bidder{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.bidder.lead{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.bidder.out{opacity:.5}
.bidder.me{background:color-mix(in srgb,var(--panel2) 80%,var(--accent) 20%)}
.bidder .nm b{font-size:1.05rem}
.bidder .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.45rem;background:var(--c,#888);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);flex:none}
.badge.s{width:28px;height:28px;font-size:.95rem;border-radius:8px}
.coin{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700}
.status{font-family:var(--label);font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.youtag{font-family:var(--label);font-weight:700;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;background:var(--accent);color:var(--ink);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.sealin{width:110px}
.rec{display:flex;gap:10px;align-items:center;font-size:.92rem}
.squads{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sheet{background:var(--panel2);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.sheet header{display:flex;align-items:center;gap:10px}
.sheet header .nm{font-family:var(--display);font-weight:900;font-size:1.3rem;text-transform:uppercase;line-height:1;flex:1;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.pc{display:inline-flex;align-items:center;gap:5px;padding:3px 8px 3px 4px;border-radius:7px;font-size:.84rem;font-weight:600;color:var(--ink);background:linear-gradient(150deg,var(--tier1,#e0a877),var(--tier2,#a8683c))}
.pc.silver{--tier1:#f4f6f9;--tier2:#a9b4bf}.pc.gold{--tier1:#fff0a8;--tier2:#d9a520}.pc.legend{background:linear-gradient(120deg,#ffd1f7,#c4f1ff,#fff3b0)}
.pc .r{font-family:var(--display);font-weight:900;font-size:.95rem;background:rgba(0,0,0,.78);color:#fff;border-radius:4px;padding:0 4px}
.pc .x2{background:var(--accent2);color:var(--ink);border-radius:4px;padding:0 4px;font-family:var(--label)}
.pitch{background:repeating-linear-gradient(90deg,#1b5c3c 0 24px,#1f6643 24px 48px);border:2px solid rgba(255,255,255,.4);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;position:relative}
.pitch::after{content:"";position:absolute;left:8%;right:8%;top:50%;border-top:2px solid rgba(255,255,255,.3)}
.pitch .ln{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;min-height:24px;position:relative;z-index:1}
.pw-tag{font-family:var(--label);font-weight:700;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:2px 8px}
.empty{color:var(--dim);font-style:italic;font-size:.88rem}
.log{display:flex;flex-direction:column;gap:3px;max-height:190px;overflow:auto;font-size:.88rem;color:var(--dim)}
.log div:first-child{color:var(--chalk)}
.setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.setup{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kv{display:flex;flex-direction:column;gap:2px;background:var(--panel2);border-radius:10px;padding:10px 12px}
.kv b{font-family:var(--display);font-size:1.35rem}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:8px;border:2px solid transparent;padding:0;background:var(--c)}
.sw.on{border-color:var(--chalk);box-shadow:0 0 0 2px var(--bg)}
.icons{display:flex;gap:4px;flex-wrap:wrap}
.ic{width:36px;height:36px;padding:0;font-size:1.15rem;background:var(--panel2);border:1px solid var(--line)}
.ic.on{background:var(--accent)}
.mgr{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:10px;background:var(--panel2)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:20;overflow:auto}
.modal .panel{width:min(1100px,100%);background:var(--panel)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ritem{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 9px;border-radius:9px;background:var(--panel2);border-left:5px solid var(--tc,#a8683c)}
.ritem .n{font-weight:600;line-height:1.15}
.ritem .t{font-size:.76rem;color:var(--dim)}
.ritem .rr{font-family:var(--display);font-weight:900;font-size:1.4rem}
.ritem.gone{opacity:.45}
.trade{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.trade{grid-template-columns:1fr}}
.pick{display:flex;flex-direction:column;gap:4px}
.pick label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:7px;cursor:pointer;font-size:.92rem}
.pick label:hover{background:var(--panel2)}
.offer{padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.offer.forme{border-color:var(--accent)}
.offer .sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ov{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:rgba(0,0,0,.55);animation:fade .2s}
.ov.solid{background:color-mix(in srgb,var(--bg) 95%,transparent)}
@keyframes fade{from{opacity:0}}
.soldbox{display:flex;flex-direction:column;align-items:center;gap:16px;position:relative}
.soldbox .card{width:260px}
.stamp{position:absolute;top:70px;font-family:var(--display);font-weight:900;font-size:5.5rem;color:var(--accent2);border:8px solid var(--accent2);border-radius:14px;padding:0 18px;transform:rotate(-14deg);background:rgba(0,0,0,.25);animation:stamp .4s cubic-bezier(.3,1.6,.5,1) both;text-shadow:0 2px 0 rgba(0,0,0,.3)}
@keyframes stamp{from{transform:rotate(-14deg) scale(3);opacity:0}}
.soldto{font-family:var(--display);font-weight:900;font-size:2rem;text-transform:uppercase;text-align:center}
.drum{font-family:var(--display);font-weight:900;font-size:clamp(2.5rem,6vw,4.5rem);text-transform:uppercase;text-align:center;animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end;max-width:760px;margin:0 auto;width:100%}
.step{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.step .blk{width:100%;border-radius:12px 12px 0 0;background:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:3rem;color:var(--ink);animation:grow .8s cubic-bezier(.2,1.2,.4,1) both;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}}
.step .who{font-family:var(--display);font-weight:900;font-size:1.4rem;text-transform:uppercase;line-height:1}
.crown{font-family:var(--label);font-weight:700;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;font-size:.8rem}
.comm{font-size:1.08rem;line-height:1.6;max-width:70ch;white-space:pre-wrap}
.comm .cur{display:inline-block;width:.55em;height:1.1em;background:var(--accent);vertical-align:-2px;animation:blink .8s steps(2) infinite}
@keyframes blink{to{opacity:0}}
.resgrid{display:grid;grid-template-columns:minmax(0,1.5fr) 300px;gap:18px;align-items:start}
@media (max-width:900px){.resgrid{grid-template-columns:1fr}}
.mvp .card{width:100%}
.rank{display:grid;grid-template-columns:2em 32px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rank .sc{font-family:var(--display);font-weight:900;font-size:1.6rem;color:var(--accent)}
.judge{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;text-align:left}
@media (max-width:900px){.judge{grid-template-columns:1fr}}
.judge .st{background:var(--panel2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.judge textarea{min-height:110px;font-size:.85rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--chalk);color:var(--ink);padding:10px 16px;border-radius:9px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:50}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

    if(a.power==="double"){if(!m.squad.includes(a.pid))throw"Pick one of your own players.";use();s.doubled[a.pid]=true;log(s,`${m.name} played DOUBLE on ${P[a.pid].name}.`);s.lastPower={n:s.seq,txt:`${P[a.pid].name} now counts double!`};break}
    if(!t||t===m)throw"Pick a target manager.";
    if(a.power==="steal"&&!t.squad.includes(a.pid))throw"Pick one of their players.";
    if(a.power==="swap"&&(!t.squad.includes(a.pid2)||!m.squad.includes(a.pid)))throw"Pick one of your players and one of theirs.";
    use();if(t.powers.includes("block")){t.powers.splice(t.powers.indexOf("block"),1);log(s,`${t.name} BLOCKED ${m.name}'s ${POWERS[a.power].name}!`);s.lastPower={n:s.seq,txt:`Blocked! ${t.name} stopped the ${POWERS[a.power].name}.`};break}
    if(a.power==="steal"){t.squad=t.squad.filter(x=>x!==a.pid);m.squad.push(a.pid);log(s,`${m.name} STOLE ${P[a.pid].name} from ${t.name}!`);s.lastPower={n:s.seq,txt:`${m.name} stole ${P[a.pid].name}!`}}
    else{m.squad=m.squad.filter(x=>x!==a.pid).concat(a.pid2);t.squad=t.squad.filter(x=>x!==a.pid2).concat(a.pid);log(s,`${m.name} SWAPPED ${P[a.pid].name} for ${t.name}'s ${P[a.pid2].name}!`);s.lastPower={n:s.seq,txt:`Swap! ${P[a.pid2].name} joins ${m.name}.`}}
    break}
  case"next":{hostOnly();s.trades.forEach(t=>{if(t.status==="open")t.status="cancelled"});
    if(s.phase==="trade1"){const left=P.filter(p=>!s.used.includes(p.id)).sort((x,y)=>y.r-x.r).slice(0,30).map(p=>p.id);
      const w=shuffle(left).slice(0,s.settings.wild);s.used.push(...w);
      s.queue=shuffle([...w.map(pid=>({k:"p",pid})),...(s.settings.powers?Object.keys(POWERS).map(power=>({k:"w",power})):[])]);
      s.round="wild";s.phase="wild";s.lotNo=0;s.lotTotal=s.queue.length;log(s,"Wildcard round: extra players and power cards, bought with leftover money. No squad limit.");nextLot(s)}
    else if(s.phase==="trade2"){s.phase="results";log(s,"The window has closed. Over to Claude.")}break}
  case"verdict":hostOnly();s.verdict=a.verdict;break;
  default:throw"Unknown move."}
  return s}

function act(a){a.by=ME;try{G=reduce(G,a);commit()}catch(e){toast(typeof e==="string"?e:"Something went wrong.");if(typeof e!=="string")console.error(e)}}

function leaveNet(){offs.forEach(f=>{try{f()}catch(e){}});offs=[]}
function watchActions(){const ref=fdb.ref(`games/${CODE}/actions`);
  const h=snap=>{const v=snap.val();snap.ref.remove().catch(()=>{});if(!v||!G)return;let a;try{a=JSON.parse(v.a)}catch(e){return}a.by=v.by;

  ref.on("child_added",h,()=>toast("Lost the connection to your game."));offs.push(()=>ref.off("child_added",h))}
function watchState(){const ref=fdb.ref(`games/${CODE}/state`);

async function joinOnline(code,profile){if(!online())return toast("Online play isn't connected yet.");

const fx=document.getElementById("fx"),fxc=fx.getContext("2d");let parts=[],fxOn=false;
function confetti(colors,n=160){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;fx.width=innerWidth;fx.height=innerHeight;
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*16-4,s:5+Math.random()*7,c:colors[i%colors.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:1});

function fxLoop(){fxc.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.life>0&&p.y<fx.height+20);
  for(const p of parts){p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;p.life-=.006;fxc.save();fxc.translate(p.x,p.y);fxc.rotate(p.r);fxc.globalAlpha=Math.max(0,p.life);fxc.fillStyle=p.c;fxc.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);fxc.restore()}
  if(parts.length)requestAnimationFrame(fxLoop);else{fxOn=false;fxc.clearRect(0,0,fx.width,fx.height)}}

function setup(){const s=G.settings,mx=maxM(G),host=amHost(),custom=G.mode==="custom";
  const managers=`<div style="display:flex;flex-direction:column;gap:6px">${G.managers.map(m=>`<div class="mgr">${badge(m)}<div><b>${esc(m.name)}</b>${you(m)}${role!=="local"&&m.owner!==G.host?' <span class="lbl">online</span>':""}</div><div class="row">${host||mine(m)?`<button class="ghost sm" data-a="cyc" data-mid="${m.id}">Badge</button>`:""}${host?`<button class="ghost sm" data-a="removeM" data-mid="${m.id}">Remove</button>`:""}</div></div>`).join("")||'<span class="empty">No managers yet.</span>'}</div>`;
  if(!host){return`<div class="setup"><div class="col"><div class="panel"><span class="lbl">Game mode</span><h2>${esc(MODE.name)}</h2><p class="muted">${esc(BLURB[G.mode])}</p>
      <div class="row between"><span class="small muted">${P.length} ${esc(MODE.noun)}s</span><button class="ghost" data-a="roster" ${P.length?"":"disabled"}>View all ${esc(MODE.noun)}s</button></div></div>
    <div class="panel"><h2>Rules</h2><div class="sets">${SETS.map(([k,l,o])=>`<div class="kv"><span class="lbl">${l}</span><b>${esc((o.find(x=>String(x[0])===String(s[k]))||[0,s[k]])[1])}</b></div>`).join("")}</div></div></div>
    <div class="col">${watchingNote()}<div class="panel"><h2>Managers (${G.managers.length})</h2>${managers}<p class="muted">Waiting for the host to start the auction…</p></div>${feed()}</div></div>`}
  const sel=(k,opts)=>`<select id="set-${k}" data-set="${k}">${opts.map(([v,l])=>`<option value="${v}" ${String(s[k])===String(v)?"selected":""}>${l}</option>`).join("")}</select>`;
  return`<div class="setup"><div class="col">
    ${CODE?`<div class="panel"><span class="lbl">Game code</span><div class="codebig">${esc(CODE)}</div><p class="small muted">Friends open this website, type the code under "Join a friend's game", or use the invite link. Keep this tab open: your laptop runs the game.</p><div class="row"><button data-a="copylink">Copy invite link</button></div></div>`:""}
    <div class="panel"><div class="field"><label class="lbl" for="mode-sel">Game mode</label>
      <select id="mode-sel" style="font-size:1.1rem">${GROUPS.map(([g,ks])=>`<optgroup label="${g}">${ks.map(k=>`<option value="${k}" ${G.mode===k?"selected":""}>${esc(NAMES[k])}</option>`).join("")}</optgroup>`).join("")}</select></div>
      <p class="muted">${esc(BLURB[G.mode])}</p>
      ${custom?`<div class="field"><label class="lbl" for="c-title">Name your mode</label><input id="c-title" maxlength="30" value="${esc(G.custom.title)}" placeholder="e.g. Best snacks ever" data-keep></div>
        <div class="field"><label class="lbl" for="c-text">Your list (one per line: Name, or Name, Role, Rating)</label><textarea id="c-text" placeholder="Pizza, Savoury, 92&#10;Tim Tams, Sweet, 88&#10;Sushi" data-keep>${esc(G.custom.text)}</textarea></div>
        <div class="field"><label class="lbl" for="c-judge">How should Claude judge?</label><input id="c-judge" maxlength="200" value="${esc(G.custom.judge)}" placeholder="e.g. Which lineup makes the best meal" data-keep></div>`:""}
      <div class="row between"><span class="small muted">${P.length} ${esc(MODE.noun)}s in this mode${mx>=2?` · up to ${mx} managers`:""}</span><button class="ghost" data-a="roster" ${P.length?"":"disabled"}>View all ${esc(MODE.noun)}s</button></div></div>
    <div class="panel"><h2>Rules</h2><div class="sets">${SETS.map(([k,l,o])=>`<div class="field"><label class="lbl" for="set-${k}">${l}</label>${sel(k,o)}</div>`).join("")}</div></div></div>
    <div class="col"><div class="panel"><h2>Managers (${G.managers.length})</h2>
      <form id="f-add" class="field"><label class="lbl" for="m-name">${CODE?"Add a manager on this laptop (you, or someone sharing it)":"Add a manager"}</label><div class="row"><input id="m-name" maxlength="18" placeholder="e.g. Harry FC" style="flex:1" data-keep value="${myMs().length?"":esc(PROFILE.name||"")}"><button type="submit" class="acc-b">Add</button></div>${pickers()}</form>
      ${managers}
      <button class="acc-b big" data-a="start" ${G.managers.length<2?"disabled":""}>Start auction${G.managers.length>=2?` · ${G.managers.length*s.squad} ${esc(MODE.noun)}s`:""}</button>
      ${mx<G.managers.length&&P.length?`<p class="small" style="color:var(--accent2)">This mode fits ${mx} managers with these rules. Lower the squad size or remove someone.</p>`:""}
    </div>${feed()}</div></div>`}

// ---------- roster ----------
function roster(){const info=G&&ui.screen==="game"?MODE:modeInfo(ui.previewMode||"soccer"),list0=info.list,inGame=!!G&&ui.screen==="game"&&G.phase!=="setup";
  const owner={};if(inGame)G.managers.forEach(m=>m.squad.forEach(id=>owner[id]=m));
  const inDraft=new Set(inGame?G.used:[]),q=ui.rq.toLowerCase();
  const list=list0.filter(p=>(!q||p.name.toLowerCase().includes(q)||p.nat.toLowerCase().includes(q))&&(!ui.rrole||p.pos===ui.rrole)).sort((a,b)=>b.r-a.r);
  const roles=info.roles.length<=12?info.roles:[];
  return`<div class="modal" data-a="closeR"><div class="panel" data-stop="1"><div class="row between"><h2>${esc(info.name)}: all ${list0.length} ${esc(info.noun)}s</h2><button class="ghost" data-a="closeR">Close</button></div>
  ${list0.length?`<div class="row"><input id="rq" placeholder="Search names or teams" value="${esc(ui.rq)}" style="flex:1;min-width:200px">
  ${roles.length>1?`<button class="sm ${ui.rrole?"ghost":"acc-b"}" data-a="rrole" data-v="">All</button>${roles.map(r=>`<button class="sm ${ui.rrole===r?"acc-b":"ghost"}" data-a="rrole" data-v="${esc(r)}">${esc(r)}</button>`).join("")}`:""}</div>
  <p class="small muted">${inGame?"Faded = not in this draft. Owned ones show their manager's badge.":"Each game draws a random selection from this list. Ratings are rough guides."}</p>
  <div class="rgrid">${list.map(p=>{const o=owner[p.id];return`<div class="ritem ${inGame&&!inDraft.has(p.id)?"gone":""}" style="--tc:${TIERC[tier(p.r)]}"><span class="rr">${p.r}</span><div style="min-width:0"><div class="n">${esc(p.name)}</div><div class="t">${esc(p.pos)} · ${esc(p.nat)}</div></div>${o?badge(o,1):""}</div>`}).join("")||'<span class="empty">No matches.</span>'}</div>`
  :'<p class="muted">Custom mode uses the list the host types in during setup.</p>'}</div></div>`}

// ---------- auction ----------
function auction(){const L=G.lot;if(!L)return"";const p=L.k==="p"?P[L.pid]:null,lead=L.leader&&Mby(L.leader),wild=G.round==="wild",host=amHost();
  const card=cardHTML(p,{power:L.k==="w"?L.power:null,mystery:L.mystery,guide:true,id:"lotcard"});
  const rows=G.managers.map(m=>{const me=mine(m);
    if(L.blind){const can=L.blindIds.includes(m.id),done=m.id in L.sealed;
      return`<div class="bidder ${can?"":"out"} ${me&&role!=="local"?"me":""}">${badge(m)}<div class="nm"><b>${esc(m.name)}</b>${you(m)}<div class="small"><span class="coin" data-coin="${m.id}" data-v="${m.money}">$${m.money}</span> · ${m.squad.length}/${G.settings.squad}</div></div>
      <div class="acts">${!can?'<span class="status muted">Can\'t bid</span>':done?'<span class="status acc">Locked in</span>':me?`<input type="password" inputmode="numeric" class="sealin" id="seal-${m.id}" placeholder="Secret $" autocomplete="off" data-keep><button class="acc-b" data-a="seal" data-mid="${m.id}">Lock</button><button class="ghost" data-a="sealskip" data-mid="${m.id}">Skip</button>`:'<span class="status muted">Thinking…</span>'}</div></div>`}
    const can=eligible(G,m),isLead=m.id===L.leader,passed=L.passed.includes(m.id);
    const st=isLead?'<span class="status acc">Top bid</span>':passed?'<span class="status muted">Passed</span>':!can?`<span class="status muted">${wild||m.squad.length<G.settings.squad?"Not enough money":"Squad full"}</span>`:null;
    return`<div class="bidder ${isLead?"lead":""} ${!can&&!isLead?"out":""} ${me&&role!=="local"?"me":""}">${badge(m)}<div class="nm"><b>${esc(m.name)}</b>${you(m)}<div class="small"><span class="coin" data-coin="${m.id}" data-v="${m.money}">$${m.money}</span> · ${m.squad.length}${wild?"":"/"+G.settings.squad} ${esc(MODE.noun)}s${m.powers.length?" · "+m.powers.map(x=>POWERS[x].name).join(", "):""}</div></div>
    <div class="acts">${st||(me?[1,5,10].map(i=>`<button data-a="bid" data-mid="${m.id}" data-inc="${i}" ${L.bid+i<=m.money||i===1?"":"disabled"}>+$${i}</button>`).join("")+`<button class="ghost" data-a="pass" data-mid="${m.id}">Pass</button>`:'<span class="status">Can bid</span>')}</div></div>`}).join("");
  const rec=G.record&&Mby(G.record.mid);
  return`<div class="table"><div class="cardwrap">${card}
    ${rec?`<div class="panel" style="padding:12px"><span class="lbl">Biggest buy</span><div class="rec">${badge(rec,1)}<span><b>${esc(G.record.k==="w"?POWERS[G.record.power].name+" card":P[G.record.pid].name)}</b> · ${esc(rec.name)}</span><span class="coin" style="margin-left:auto">$${G.record.amt}</span></div></div>`:""}</div>
  <div class="panel" id="stage"><div class="lotinfo"><div><span class="lbl">${wild?`Wildcard round · lot ${G.lotNo} of ${G.lotTotal}`:`Lot ${G.lotNo} · ${G.queue.length} left in the queue`}${L.blind?" · BLIND BID":""}</span>
    <div class="amt">${L.blind?"???":"$"+L.bid}</div><div>${L.blind?"Each manager secretly locks in one bid. Highest wins.":lead?`<b>${esc(lead.name)}</b> leads`:"No bids yet. The clock starts on the first bid."}</div></div>
    ${L.blind?(host?`<button class="ghost" data-a="sell">Reveal now</button>`:""):`<div class="clock" id="clock"><span class="lbl" id="clock-l">Clock</span><span class="sec" id="clock-s">${G.settings.timer}s</span><div class="barb"><b id="clock-b" style="width:100%"></b></div></div>`}</div>
    <div class="bidders">${rows}</div>
    ${L.blind?"":`<div class="row between"><span class="small muted">If nobody beats a bid in ${G.settings.timer} seconds, it's sold.</span>${host?`<button class="ghost sm" data-a="sell">${lead?"Sell now":"Skip"}</button>`:""}</div>`}</div></div>`}

// ---------- trading ----------
function tradeUI(){const mineList=myMs();
  const side=x=>[...x.p.map(id=>pchip(id)),x.m?`<span class="coin">$${x.m}</span>`:""].filter(Boolean).join(" ")||'<span class="muted">nothing</span>';
  const open=G.trades.filter(t=>t.status==="open");
  const offers=`<div class="panel"><h2>Offers</h2>
    ${open.length?open.map(t=>{const f=Mby(t.from),o=Mby(t.to);if(!f||!o)return"";const forMe=mine(o),fromMe=mine(f);
      return`<div class="offer ${forMe&&role!=="local"?"forme":""}"><div class="row">${badge(f,1)}<b>${esc(f.name)}</b><span class="muted">→</span>${badge(o,1)}<b>${esc(o.name)}</b>${t.counterOf?'<span class="pw-tag">Counter</span>':""}</div>
      <div class="sides small"><div><span class="lbl">${esc(f.name)} gives</span><div class="chips">${side(t.give)}</div></div><div><span class="lbl">${esc(o.name)} gives</span><div class="chips">${side(t.get)}</div></div></div>
      <div class="row">${forMe?`<button class="acc-b sm" data-a="accept" data-tid="${t.id}">Accept (final)</button><button class="ghost sm" data-a="counter" data-tid="${t.id}">Counter</button><button class="ghost sm" data-a="decline" data-tid="${t.id}">Decline</button>`:""}
      ${fromMe?`<button class="ghost sm" data-a="cancel" data-tid="${t.id}">Withdraw</button>`:""}${!forMe&&!fromMe?`<span class="small muted">Waiting for ${esc(o.name)}</span>`:""}</div></div>`}).join(""):'<span class="empty">No open offers.</span>'}
    ${amHost()?`<button data-a="next">${G.phase==="trade1"?"Close trading → Wildcards":"Close the window → Results"}</button>`:'<span class="small muted">The host closes the trading window.</span>'}</div>`;
  if(!mineList.length)return`<div class="trade"><div class="col">${watchingNote()}</div><div class="col">${offers}</div></div>`;
  let d=ui.td;const others=f=>G.managers.filter(m=>m.id!==f);
  if(!d||!mine(Mby(d.from))||!Mby(d.to)||d.from===d.to){const f=mineList[0].id;d=ui.td={from:f,to:others(f)[0]?.id,give:[],get:[],gm:0,tm:0,counterOf:null}}
  const f=Mby(d.from),o=Mby(d.to);if(!o)return`<div class="trade"><div></div><div class="col">${offers}</div></div>`;
  d.give=d.give.filter(id=>f.squad.includes(id));d.get=d.get.filter(id=>o.squad.includes(id));
  const box=(m,arr,key)=>m.squad.length?m.squad.map(id=>{const p=P[id];return`<label><input type="checkbox" data-pick="${key}" value="${id}" ${arr.includes(id)?"checked":""}>${pchip(id)}<span class="small muted">${esc(p.pos)}</span></label>`}).join(""):'<span class="empty">Nobody</span>';
  return`<div class="trade"><div class="panel"><div class="row between"><h2>${d.counterOf?"Counter-offer":"Make an offer"}</h2>${d.counterOf?'<button class="ghost sm" data-a="clearTd">Start fresh</button>':""}</div>
    <div class="row">${mineList.length>1?`<label class="lbl" for="t-from">From</label><select id="t-from">${mineList.map(m=>`<option value="${m.id}" ${m.id===d.from?"selected":""}>${esc(m.name)}</option>`).join("")}</select>`:""}
      <label class="lbl" for="t-to">Trade with</label><select id="t-to">${others(d.from).map(m=>`<option value="${m.id}" ${m.id===d.to?"selected":""}>${esc(m.name)}</option>`).join("")}</select></div>
    <div class="sets" style="grid-template-columns:1fr 1fr"><div class="pick"><span class="lbl">${esc(f.name)} gives</span>${box(f,d.give,"give")}<div class="row"><label class="lbl" for="t-gm">+ money</label><input id="t-gm" type="number" min="0" max="${f.money}" value="${d.gm}" style="width:90px"></div></div>
      <div class="pick"><span class="lbl">${esc(o.name)} gives</span>${box(o,d.get,"get")}<div class="row"><label class="lbl" for="t-tm">+ money</label><input id="t-tm" type="number" min="0" max="${o.money}" value="${d.tm}" style="width:90px"></div></div></div>
    <button class="acc-b" data-a="propose">Send offer to ${esc(o.name)}</button></div>
  <div class="col">${offers}${G.phase==="trade2"?powerUI():""}</div></div>`}
function powerUI(){const holders=myMs().filter(m=>m.powers.some(p=>p!=="block"));
  if(!holders.length)return`<div class="panel"><h2>Power cards</h2><span class="empty">${role==="local"?"Nobody has":"You don't have"} a playable power card.${G.managers.some(m=>m.powers.includes("block"))?" Block cards work automatically.":""}</span></div>`;
  const w=ui.pw;if(!holders.some(m=>m.id===w.mid))w.mid=holders[0].id;const m=Mby(w.mid);const usable=[...new Set(m.powers.filter(p=>p!=="block"))];if(!usable.includes(w.power))w.power=usable[0];
  const others=G.managers.filter(x=>x.id!==m.id);if(!others.some(x=>x.id===w.target))w.target=others[0]?.id;const t=Mby(w.target);
  const pl=(mm,k)=>`<select data-pw="${k}" id="pw-${k}"><option value="">Pick…</option>${mm.squad.map(id=>`<option value="${id}" ${String(w[k])===String(id)?"selected":""}>${esc(P[id].name)} (${P[id].r})</option>`).join("")}</select>`;
  return`<div class="panel"><h2>Power cards</h2><p class="small muted">Block cards work automatically when someone targets you.</p>
  <div class="row">${holders.length>1?`<select data-pw="mid" id="pw-mid">${holders.map(x=>`<option value="${x.id}" ${x.id===m.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`:""}
  <select data-pw="power" id="pw-power">${usable.map(p=>`<option value="${p}" ${p===w.power?"selected":""}>${POWERS[p].name}</option>`).join("")}</select></div>
  <p class="small">${POWERS[w.power].desc}</p>
  ${w.power==="double"?`<div class="row"><span class="lbl">Player</span>${pl(m,"pid")}</div>`:`<div class="row"><span class="lbl">Target</span><select data-pw="target" id="pw-target">${others.map(x=>`<option value="${x.id}" ${x.id===w.target?"selected":""}>${esc(x.name)}${x.powers.includes("block")?" (has Block)":""}</option>`).join("")}</select></div>
    ${w.power==="steal"?`<div class="row"><span class="lbl">Steal</span>${pl(t,"pid")}</div>`:`<div class="row"><span class="lbl">Give</span>${pl(m,"pid")}<span class="lbl">Take</span>${pl(t,"pid2")}</div>`}`}
  <button class="acc-b" data-a="usepower">Play ${POWERS[w.power].name}</button></div>`}

// ---------- results ----------
const judgeN=()=>{const c=G.managers.map(m=>m.squad.length).filter(n=>n>0);return c.length?Math.min(...c):0};
function quick(){const N=judgeN();return G.managers.map(m=>{const top=[...m.squad].sort((x,y)=>P[y].r*(G.doubled[y]?2:1)-P[x].r*(G.doubled[x]?2:1)).slice(0,N);
  const sc=top.length?Math.round(top.reduce((x,id)=>x+P[id].r*(G.doubled[id]?1.5:1),0)/N+new Set(top.map(id=>P[id].pos)).size*2+m.money/20):0;return{m,sc,top}}).sort((a,b)=>b.sc-a.sc)}
const squadsText=()=>G.managers.map(m=>`${m.name} ($${m.money} left): `+(m.squad.map(id=>`${P[id].name} (${P[id].pos}, ${P[id].nat}, rating ${P[id].r}${G.doubled[id]?", DOUBLE: counts twice":""})`).join("; ")||`no ${MODE.noun}s`)).join("\n");
function judgePrompt(){const N=judgeN();return`You are the judge and commentator of a draft game between friends called Transfer Window. Game mode: ${MODE.name}. Each manager bought ${MODE.noun}s in a live auction, traded, bought wildcards and played power cards.
Rule: the smallest squad has ${N}, so every manager may only use their best ${N} ${MODE.noun}s. For each manager choose their strongest ${N} (best combination, not just highest ratings). A player marked DOUBLE counts twice as much.
${MODE.judge} Leftover money is only a tiny tiebreaker. A manager with nobody finishes last. Be fair, fun and exciting, suitable for kids.

Final squads:
${squadsText()}

Reply with JSON only (no other text), in exactly this shape:
{"winner":"<manager name exactly as written>","summary":"2 sentences on why they won","commentary":"an exciting 130-180 word play-by-play of the decisive showdown, written like a live commentator, naming real ${MODE.noun}s from the lineups","mvp":{"name":"<one ${MODE.noun} from any lineup>","manager":"<their manager>","why":"one sentence"},"ranking":[{"name":"<manager>","lineup":["<exactly ${N} names>"],"score":<0-100>,"why":"one short sentence"}]}
Include every manager in ranking, best first.`}
function cleanVerdict(v){if(!v||!Array.isArray(v.ranking)||!v.ranking.length)throw"Claude's answer is missing the ranking. Ask it to reply with the JSON again.";const N=judgeN();
  return{n:N,winner:String(v.winner||v.ranking[0]?.name||"").slice(0,40),summary:String(v.summary||"").slice(0,600),commentary:String(v.commentary||"").slice(0,3000),
    mvp:v.mvp&&v.mvp.name?{name:String(v.mvp.name).slice(0,60),manager:String(v.mvp.manager||"").slice(0,40),why:String(v.mvp.why||"").slice(0,300)}:null,
    ranking:v.ranking.slice(0,MAXMGR).map(r=>({name:String(r.name).slice(0,40),lineup:(Array.isArray(r.lineup)?r.lineup:[]).slice(0,N).map(x=>String(x).slice(0,60)),score:Math.max(0,Math.min(100,Math.round(+r.score||0))),why:String(r.why||"").slice(0,300)}))}}
function parseVerdict(text){const a=text.indexOf("{"),b=text.lastIndexOf("}");if(a<0||b<=a)throw"I couldn't find Claude's answer in that. Paste Claude's whole reply.";
  let v;try{v=JSON.parse(text.slice(a,b+1))}catch(e){throw"That answer isn't in the right format. Ask Claude to reply with the JSON only, then paste it again."}return cleanVerdict(v)}
function quickVerdict(){const q=quick(),N=judgeN(),w=q[0];let best=null;q.forEach(x=>x.top.forEach(id=>{if(!best||P[id].r>P[best.id].r)best={id,m:x.m}}));
  return cleanVerdict({winner:w.m.name,summary:`${w.m.name} wins on the quick score: the best average rating across their top ${N}, plus a bonus for variety.`,commentary:"",
    mvp:best?{name:P[best.id].name,manager:best.m.name,why:`The highest-rated ${MODE.noun} in any final lineup.`}:null,
    ranking:q.map(x=>({name:x.m.name,lineup:x.top.map(id=>P[id].name),score:Math.min(100,x.sc),why:x.top.length?`Average rating ${Math.round(x.top.reduce((s,id)=>s+P[id].r,0)/x.top.length)}.`:`No ${MODE.noun}s.`}))})}
function startTyping(){clearInterval(startTyping.h);startTyping.h=setInterval(()=>{const txt=G?.verdict?.commentary||"";ui.typePos+=3;const el=document.getElementById("comm");
  if(el)el.innerHTML=esc(txt.slice(0,ui.typePos))+(ui.typePos<txt.length?'<span class="cur"></span>':"");if(ui.typePos>=txt.length)clearInterval(startTyping.h)},30)}
function results(){const v=G.verdict,N=judgeN(),host=amHost();
  if(!v||ui.reveal==="drum"){const q=quick();return`<div class="panel" style="align-items:center;text-align:center;padding:34px 18px"><h2 style="font-size:3rem">Who wins?</h2>
    <p class="muted" style="max-width:60ch">The smallest squad has <b>${N}</b>, so everyone is judged on their best ${N}. Claude picks each lineup, names the winner and the MVP, and commentates the decider.</p>
    ${host?`<div class="judge" style="width:100%">
      <div class="st"><span class="num acc" style="font-family:var(--display);font-size:2rem;font-weight:900">1</span><b>Copy the judging prompt</b><p class="small muted">It has every squad and the rules.</p><button class="acc-b" data-a="copyprompt">Copy prompt</button></div>
      <div class="st"><span class="num acc" style="font-family:var(--display);font-size:2rem;font-weight:900">2</span><b>Paste it into Claude</b><p class="small muted">Open <a href="https://claude.ai/new" target="_blank" rel="noopener" style="color:var(--accent)">claude.ai</a> in a new tab, paste, and send.</p></div>
      <div class="st"><span class="num acc" style="font-family:var(--display);font-size:2rem;font-weight:900">3</span><b>Paste Claude's answer here</b><textarea id="verdict-in" placeholder="Paste Claude's whole reply" data-keep></textarea><button class="acc-b" data-a="reveal">Reveal the winner</button></div></div>
      <button class="ghost sm" data-a="quickwin">No Claude? Use the quick score instead</button>`
      :`<p class="drum" style="font-size:2rem;animation:none">Waiting for the host to get Claude's verdict…</p>`}</div>
    <div class="panel"><span class="lbl">Quick score (best ${N} by rating + variety)</span>${q.map((x,i)=>`<div class="rank"><b>${i+1}</b>${badge(x.m,1)}<div><b>${esc(x.m.name)}</b>${you(x.m)}<div class="chips">${x.top.map(pchip).join("")}</div></div><span class="sc">${x.sc}</span></div>`).join("")}</div>${sheets()}`}
  const byName=n=>G.managers.find(m=>m.name.toLowerCase()===String(n).toLowerCase())||{name:n,color:"#888",icon:"?"};
  const top=v.ranking.slice(0,3),order=[top[1],top[0],top[2]],hts=[150,210,110],places=[2,1,3];
  const mvpP=v.mvp&&P.find(p=>p.name.toLowerCase()===v.mvp.name.toLowerCase());
  const txt=v.commentary,typed=ui.typeFor===G.id&&ui.typePos<txt.length;
  return`<div class="panel" style="gap:20px"><div style="text-align:center"><span class="crown">Champion</span><h2 style="font-size:3.4rem">${esc(v.winner)} wins!</h2><p class="muted" style="max-width:60ch;margin:6px auto 0">${esc(v.summary)}</p></div>
    <div class="podium">${order.map((r,i)=>r?`<div class="step"><span class="badge" style="--c:${esc(byName(r.name).color)}">${esc(byName(r.name).icon)}</span><span class="who">${esc(r.name)}</span><span class="coin">${r.score}</span><div class="blk" style="--c:${esc(byName(r.name).color)};height:${hts[i]}px;animation-delay:${[.3,.6,0][i]}s">${places[i]}</div></div>`:"<div></div>").join("")}</div></div>
  <div class="resgrid">${txt?`<div class="panel"><span class="lbl">Live commentary</span><p class="comm" id="comm">${esc(typed?txt.slice(0,ui.typePos):txt)}${typed?'<span class="cur"></span>':""}</p></div>`:'<div></div>'}
    <div class="panel mvp"><span class="crown">MVP</span>${v.mvp?(mvpP?cardHTML(mvpP,{cls:"legend",label:"MVP"}):`<div class="card legend"><span class="tier">MVP</span><span class="nm">${esc(v.mvp.name)}</span></div>`)+`<p class="small"><b>${esc(v.mvp.manager)}</b>: ${esc(v.mvp.why)}</p>`:'<span class="empty">No MVP named.</span>'}</div></div>
  <div class="panel"><span class="lbl">Final table · best ${v.n} each</span>${v.ranking.map((r,i)=>`<div class="rank"><b>${i+1}</b>${badge(byName(r.name),1)}<div><b>${esc(r.name)}</b><div class="small muted">${esc(r.why)}</div>${r.lineup.length?`<div class="chips" style="margin-top:4px">${r.lineup.map(n=>{const p=P.find(x=>x.name.toLowerCase()===n.toLowerCase());return p?pchip(p.id):`<span class="pc">${esc(n)}</span>`}).join("")}</div>`:""}</div><span class="sc">${r.score}</span></div>`).join("")}</div>
  <div class="row" style="justify-content:center">${host?`<button class="acc-b big" data-a="rematch">Play again (same managers)</button>`:'<span class="muted">The host can start another round with the same managers.</span>'}<button class="ghost big" data-a="home">Home</button></div>${sheets()}`}

// ================= render =================
function render(){const app=document.getElementById("app"),ae=document.activeElement,fid=ae&&ae.id,sel=fid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;
  const keep={};document.querySelectorAll("[data-keep]").forEach(el=>{if(el.id)keep[el.id]=el.value});
  if(ui.screen!=="home"&&!G)ui.screen="home";
  if(G)useGame(G);
  document.body.dataset.theme=ui.screen==="home"?(ui.roster&&ui.previewMode?ui.previewMode:"mega"):G.mode;
  if(ui.screen==="home"){app.innerHTML=home()}
  else{let body="";
    if(G.phase==="setup")body=setup();
    else if(G.phase==="auction"||G.phase==="wild")body=watchingNote()+auction()+sheets()+feed();
    else if(G.phase==="trade1"||G.phase==="trade2")body=`<div class="panel"><h2>${G.phase==="trade1"?"Trading window":"Final trading round"}</h2><p class="muted">${G.phase==="trade1"?"Trade players, money or both before the wildcards. Accepted deals are final.":"Last chance to trade, and the time to play power cards. Accepted deals are final."}</p></div>`+tradeUI()+sheets()+feed();
    else body=results();
    app.innerHTML=topbar()+body+footer()}
  document.getElementById("layer").innerHTML=(ui.roster?roster():"")+(ui.reveal==="drum"?`<div class="ov solid"><div class="drum">And the winner is…</div></div>`:"");
  for(const id in keep){const el=document.getElementById(id);if(el&&keep[id]!==""&&el.value!==keep[id])el.value=keep[id]}
  if(fid){const el=document.getElementById(fid);if(el){el.focus();if(sel)try{el.setSelectionRange(...sel)}catch(e){}}}
  afterRender()}
function afterRender(){if(!G||ui.screen==="home")return;
  const key=G.lot?`${G.id}:${G.round}:${G.lotNo}`:null;if(key&&key!==lastLotKey){const c=document.getElementById("lotcard");if(c){c.classList.add("flip");if(lastLotKey!==null)SFX.flip()}}lastLotKey=key;
  const bk=G.lot&&!G.lot.blind&&G.lot.leader?`${key}:${G.lot.bid}`:null;if(bk&&lastBidKey!==undefined&&bk!==lastBidKey)SFX.bid();lastBidKey=bk;
  document.querySelectorAll("[data-coin]").forEach(el=>{const id=el.dataset.coin,v=+el.dataset.v,pv=ui.coinPrev[id];
    if(pv!==undefined&&pv!==v){const t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/700);el.textContent="$"+Math.round(pv+(v-pv)*k);if(k<1)requestAnimationFrame(step)};el.textContent="$"+pv;requestAnimationFrame(step)}});
  G.managers.forEach(m=>ui.coinPrev[m.id]=m.money);
  const S=G.lastSale;if(S&&S.n!==shownSale){shownSale=S.n;showSold(S)}
  const PW=G.lastPower;if(PW&&PW.n!==shownPower){shownPower=PW.n;SFX.power();toast(PW.txt)}
  if(G.verdict&&seenVerdict!==G.id){seenVerdict=G.id;revealVerdict()}
  updateClock()}
function revealVerdict(){const gid=G.id;ui.reveal="drum";SFX.drum(2.4);render();
  setTimeout(()=>{if(!G||G.id!==gid)return;ui.reveal=null;ui.typeFor=gid;ui.typePos=0;render();SFX.fanfare();
    const v=G.verdict,w=G.managers.find(m=>m.name.toLowerCase()===v.winner.toLowerCase());confetti([w?.color||"#ffd166","#ffffff",getComputedStyle(document.body).getPropertyValue("--accent")],220);startTyping();
    const counted=LS.get("tw-counted")||[];if(!counted.includes(gid)){const wins=LS.get("tw-wins")||{};wins[v.winner]=(wins[v.winner]||0)+1;LS.set("tw-wins",wins);LS.set("tw-counted",[gid,...counted].slice(0,50))}},2400)}
function showSold(S){const m=Mby(S.mid);if(!m)return;const layer=document.createElement("div");layer.className="ov";layer.style.cursor="pointer";
  layer.innerHTML=`<div class="soldbox">${cardHTML(S.k==="p"?P[S.pid]:null,{power:S.k==="w"?S.power:null,cls:"flip"})}<div class="stamp">SOLD</div><div class="soldto">${S.mystery?"Mystery revealed! ":""}${esc(m.icon)} ${esc(m.name)} · $${S.amt}</div></div>`;
  document.body.appendChild(layer);SFX.sold();confetti([m.color,"#ffffff","#ffd166"],120);const close=()=>layer.remove();layer.onclick=close;setTimeout(close,1900)}
let lastSec=null;
function updateClock(){const box=document.getElementById("clock");if(!box||!G?.lot||G.lot.blind)return;const L=G.lot,T=G.settings.timer;
  const l=document.getElementById("clock-l"),s=document.getElementById("clock-s"),b=document.getElementById("clock-b");
  if(!L.leader){l.textContent="Clock";s.textContent=T+"s";b.style.width="100%";box.classList.remove("hot");lastSec=null;return}
  const rem=Math.max(0,L.endsAt-serverNow()),sec=Math.ceil(rem/1000);l.textContent=sec<=1?"Going, going…":"Going once…";s.textContent=sec+"s";b.style.width=Math.min(100,rem/(T*10))+"%";box.classList.toggle("hot",sec<=3);
  if(sec<=3&&sec>0&&sec!==lastSec){SFX.tick();const st=document.getElementById("stage");if(st){st.classList.remove("shake","flash");void st.offsetWidth;st.classList.add("shake","flash")}}lastSec=sec}
setInterval(()=>{if(ui.screen==="game"&&role!=="guest"&&G?.lot&&!G.lot.blind&&G.lot.leader&&serverNow()>=G.lot.endsAt)act({type:"timeout"});else updateClock()},100);

// ================= events =================
async function copyText(t,okMsg){try{await navigator.clipboard.writeText(t);toast(okMsg)}catch(e){toast("Couldn't copy automatically. Select the text and press Ctrl+C.")}}
document.addEventListener("submit",e=>{e.preventDefault();
  if(e.target.id==="f-add"){const i=document.getElementById("m-name"),name=i.value;const before=G.managers.length;i.value="";
    const firstMine=!myMs().length;act({type:"addM",name,color:ui.newM.color,icon:ui.newM.icon});if(G.managers.length>before){if(firstMine)saveProfile(name.trim());const used=G.managers.map(m=>m.color);ui.newM.color=COLORS.find(c=>!used.includes(c))||COLORS[0];ui.newM.icon=ICONS[(ICONS.indexOf(ui.newM.icon)+1)%ICONS.length];render();document.getElementById("m-name")?.focus()}else i.value=name}
  if(e.target.id==="f-join"){const code=document.getElementById("j-code").value,name=document.getElementById("j-name").value.trim();
    if(!name)return toast("Type your manager name.");saveProfile(name);joinOnline(code,{name,color:ui.newM.color,icon:ui.newM.icon})}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;if(b.dataset.a==="closeR"&&e.target.closest("[data-stop]")&&!e.target.closest("button"))return;
  const d=b.dataset,a=d.a;if(a!=="home")ui.leaveArm=false;
  switch(a){
  case"hostgame":hostOnline();break;
  case"local":startLocal(false);break;
  case"resumeLocal":startLocal(true);break;
  case"rejoin":{const s=LS.get("tw-session");if(s)joinOnline(s.code,null);break}
  case"preview":ui.previewMode=d.mode;ui.rq="";ui.rrole="";ui.roster=true;render();break;
  case"home":{const risky=G&&role!=="guest"&&!["setup","results"].includes(G.phase);if(risky&&!ui.leaveArm){ui.leaveArm=true;render();break}goHome();break}
  case"mute":SFX.muted=!SFX.muted;LS.set("tw-mute",SFX.muted);render();break;
  case"roster":ui.rq="";ui.rrole="";ui.roster=true;render();setTimeout(()=>document.getElementById("rq")?.focus(),0);break;
  case"closeR":ui.roster=false;render();break;
  case"rrole":ui.rrole=d.v;render();break;
  case"ncolor":ui.newM.color=d.v;render();break;
  case"nicon":ui.newM.icon=d.v;render();break;
  case"copylink":copyText(`${location.origin}${location.pathname}?join=${CODE}`,"Invite link copied. Send it to your friends.");break;
  case"cyc":{const m=Mby(d.mid);dispatch({type:"editM",mid:d.mid,data:{icon:ICONS[(ICONS.indexOf(m.icon)+1)%ICONS.length],color:COLORS[(COLORS.indexOf(m.color)+1)%COLORS.length]}});break}
  case"removeM":dispatch({type:"removeM",mid:d.mid});break;
  case"start":dispatch({type:"start"});scrollTo(0,0);break;
  case"bid":dispatch({type:"bid",mid:d.mid,inc:+d.inc});break;
  case"pass":dispatch({type:"pass",mid:d.mid});break;
  case"sell":dispatch({type:"sell"});break;
  case"seal":{const i=document.getElementById("seal-"+d.mid),v=i?i.value.trim():"";if(!/^\d+$/.test(v)){toast("Type a whole-dollar amount, or press Skip.");break}i.value="";SFX.bid();dispatch({type:"seal",mid:d.mid,amount:+v});break}
  case"sealskip":dispatch({type:"seal",mid:d.mid,amount:0});break;
  case"propose":{const t=ui.td;if(!t)break;dispatch({type:"propose",t:{from:t.from,to:t.to,give:{p:t.give,m:+t.gm||0},get:{p:t.get,m:+t.tm||0},counterOf:t.counterOf}});
    ui.td={from:t.from,to:t.to,give:[],get:[],gm:0,tm:0,counterOf:null};render();break}
  case"accept":dispatch({type:"respond",tid:d.tid,accept:true});break;
  case"decline":dispatch({type:"respond",tid:d.tid,accept:false});break;
  case"cancel":dispatch({type:"cancel",tid:d.tid});break;
  case"counter":{const t=G.trades.find(x=>x.id===d.tid);if(!t)break;ui.td={from:t.to,to:t.from,give:[...t.get.p],get:[...t.give.p],gm:t.get.m,tm:t.give.m,counterOf:t.id};render();scrollTo({top:0,behavior:"smooth"});toast("Change the deal, then send it back.");break}
  case"clearTd":ui.td=null;render();break;
  case"usepower":{const w=ui.pw;dispatch({type:"power",mid:w.mid,power:w.power,target:w.target,pid:w.pid===""||w.pid==null?null:+w.pid,pid2:w.pid2===""||w.pid2==null?null:+w.pid2});ui.pw={mid:w.mid};render();break}
  case"next":dispatch({type:"next"});scrollTo(0,0);break;
  case"copyprompt":copyText(judgePrompt(),"Prompt copied. Paste it into Claude.");break;
  case"reveal":{const t=document.getElementById("verdict-in")?.value||"";try{const v=parseVerdict(t);dispatch({type:"verdict",verdict:v})}catch(err){toast(typeof err==="string"?err:"That didn't work.")}break}
  case"quickwin":dispatch({type:"verdict",verdict:quickVerdict()});break;
  case"rematch":if(!amHost())break;G=newGame(G);syncSeen();ui.td=null;ui.pw={};commit();scrollTo(0,0);break;
  }});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="mode-sel")dispatch({type:"mode",mode:t.value});
  else if(t.dataset.set){const k=t.dataset.set,v=k==="powers"?t.value==="true":+t.value;dispatch({type:"setting",key:k,val:v})}
  else if(t.id==="t-from"){ui.td={...ui.td,from:t.value,give:[],gm:0,counterOf:null};render()}
  else if(t.id==="t-to"){ui.td={...ui.td,to:t.value,get:[],tm:0,counterOf:null};render()}
  else if(t.dataset.pick){const arr=ui.td[t.dataset.pick],id=+t.value;if(t.checked){if(!arr.includes(id))arr.push(id)}else arr.splice(arr.indexOf(id),1)}
  else if(t.dataset.pw){ui.pw[t.dataset.pw]=t.value;if(t.dataset.pw!=="pid"&&t.dataset.pw!=="pid2"){if(t.dataset.pw!=="target")ui.pw.target=undefined;ui.pw.pid=undefined;ui.pw.pid2=undefined}render()}
  else if(["c-title","c-text","c-judge"].includes(t.id)){dispatch({type:"custom",data:{[{"c-title":"title","c-text":"text","c-judge":"judge"}[t.id]]:t.value}})}});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="t-gm"&&ui.td)ui.td.gm=Math.max(0,parseInt(t.value)||0);if(t.id==="t-tm"&&ui.td)ui.td.tm=Math.max(0,parseInt(t.value)||0);
  if(t.id==="j-code"){const c=t.value.toUpperCase().replace(/[^A-Z]/g,"");if(c!==t.value)t.value=c}
  if(t.id==="rq"){ui.rq=t.value;render()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ui.roster){ui.roster=false;render()}
  if(e.key==="Enter"&&e.target.classList?.contains("sealin")){e.preventDefault();e.target.closest(".acts")?.querySelector('[data-a="seal"]')?.click()}});
render();
if(JOIN)setTimeout(()=>{document.getElementById("joinbox")?.scrollIntoView({behavior:"smooth"});document.getElementById("j-name")?.focus()},300);
</script>
